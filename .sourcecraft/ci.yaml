# Настройка события-триггера для запуска рабочего процесса
on:
  # Запуск рабочего процесса по отправке изменений в ветку main
  push:
    - workflows: [cmake-build, build-deb-package]
      filter:
        branches: ["master"]
  # Запуск рабочего процесса при создании предложений изменений
  pull_request:
    - workflows: [cmake-build, build-deb-package]
      filter:
        target_branches: ["master"]

workflows:
  cmake-build:
    tasks:
      - cmake-build-task

  build-deb-package:
    tasks:
      - build-deb-task

tasks:
  - name: cmake-build-task
    cubes:
      # Установка зависимостей
      - name: install-dependencies
        image: ubuntu:latest
        script:
          - apt-get update
          - apt-get install -y make git clang cmake qpdf clitest zlib1g-dev pkg-config
          - echo $PATH
          - clitest --version
          - which clitest
          # Если в вашем проекте используются дополнительные библиотеки, 
          # добавьте их установку здесь, например:
          # - apt-get install -y libboost-all-dev

      # Конфигурация проекта с помощью CMake
      - name: configure-project
        needs: ["install-dependencies"]
        script:
          - mkdir -p build
          - cd build
          - cmake .. -DLIBBRST_EXAMPLES=OFF -DLIBBRST_SHARED_LIB=OFF -DLIBBRST_ISO_216_ONLY=ON -DLIBBRST_DEBUG_TRACE=OFF

      # Сборка проекта
      - name: build-project
        needs: ["configure-project"]
        script:
          - cd build
          - make

      # Запуск тестов (опционально)
      - name: test-project
        needs: ["build-project"]
        script:
          - apt install -y clitest qpdf
          - cd build/tests
          - ctest -R test_beresta --verbose

  - name: build-deb-task
    cubes:
      # Установка зависимостей для сборки deb-пакета
      - name: install-dependencies
        image: ubuntu:latest
        script:
          - apt-get update
          - apt-get install -y build-essential cmake zlib1g-dev libpng-dev pkg-config

      # Конфигурация проекта с CMake (shared library)
      - name: configure-project
        needs: ["install-dependencies"]
        script:
          - mkdir -p build
          - cd build
          - cmake .. -DCMAKE_BUILD_TYPE=Release -DLIBBRST_SHARED_LIB=ON -DLIBBRST_EXAMPLES=OFF -DLIBBRST_TESTS=OFF

      # Сборка проекта
      - name: build-project
        needs: ["configure-project"]
        script:
          - cd build
          - make -j$(nproc)

      # Генерация deb-пакета
      - name: package-deb
        needs: ["build-project"]
        script:
          - cd build
          - cpack -G DEB
          - echo "=== Создан deb-пакет ==="
          - ls -la *.deb